<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>carta gato</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --ink:#0a0010;
  --rose:#e8647a;
  --rose-soft:#f5a3b0;
  --rose-pale:#fde8ed;
  --gold:#c9a84c;
  --gold-soft:#e8d08a;
  --purple:#7c3f8c;
  --purple-soft:#b87fcb;
  --cream:#fff5f7;
  --dark-color:#0a0010;
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);}

/* ── FONDO PROFUNDO ── */
.backdrop{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 50% 100%, #1a0025 0%, #0a0010 60%);
}

/* ── LUNA ── */
.moon{
  position:fixed;top:6vh;left:50%;transform:translateX(-50%);
  width:clamp(80px,14vw,140px);height:clamp(80px,14vw,140px);
  border-radius:50%;
  background:radial-gradient(circle at 38% 35%, #fff9e0 0%, #f5e07a 40%, #c9a84c 100%);
  box-shadow:0 0 40px 12px rgba(201,168,76,.25), 0 0 100px 40px rgba(201,168,76,.08);
  z-index:1;opacity:0;
  transition:opacity 2s ease;
}
.moon.show{opacity:1;}
.moon-crater{position:absolute;border-radius:50%;background:rgba(0,0,0,.08);}
.moon-crater:nth-child(1){width:22%;height:22%;top:22%;left:18%;}
.moon-crater:nth-child(2){width:14%;height:14%;top:52%;left:58%;}
.moon-crater:nth-child(3){width:10%;height:10%;top:30%;left:62%;}

/* ── ESTRELLAS ── */
.stars-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* ── PÉTALOS CAYENDO ── */
.petal{
  position:fixed;top:-30px;z-index:2;pointer-events:none;
  font-size:14px;opacity:0;
  animation:petalFall linear forwards;
}
@keyframes petalFall{
  0%  {opacity:0;transform:translateY(0) rotate(0deg) scale(.8);}
  10% {opacity:.7;}
  90% {opacity:.4;}
  100%{opacity:0;transform:translateY(110vh) rotate(720deg) scale(1.1);}
}

/* ── PANTALLA 1: BIENVENIDA ── */
#s-welcome{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease;
}
#s-welcome.out{opacity:0;pointer-events:none;}

.welcome-title{
  font-family:'Cinzel',serif;
  font-size:clamp(1rem,3.5vw,2.2rem);
  letter-spacing:.35em;
  color:var(--gold-soft);
  text-shadow:0 0 30px rgba(201,168,76,.5);
  margin-bottom:1.2rem;
  opacity:0;animation:fadeUp 1.4s .3s forwards;
}
.welcome-subtitle{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.4rem,4vw,2.8rem);
  font-style:italic;font-weight:300;
  color:var(--rose-pale);
  letter-spacing:.08em;
  margin-bottom:3.5rem;
  opacity:0;animation:fadeUp 1.4s .7s forwards;
}
.welcome-btn{
  font-family:'Cinzel',serif;
  font-size:clamp(.7rem,1.8vw,1rem);
  letter-spacing:.25em;
  color:var(--rose-soft);
  background:transparent;
  border:1px solid rgba(232,100,122,.4);
  padding:.9em 2.8em;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all .4s ease;
  opacity:0;animation:fadeUp 1.4s 1.1s forwards;
}
.welcome-btn::before{
  content:'';position:absolute;inset:0;
  background:rgba(232,100,122,.08);
  transform:translateX(-100%);
  transition:transform .4s ease;
}
.welcome-btn:hover::before{transform:translateX(0);}
.welcome-btn:hover{border-color:rgba(232,100,122,.9);color:#fff;letter-spacing:.3em;}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px);}
  to  {opacity:1;transform:translateY(0);}
}

/* ── DECORACIÓN: LÍNEAS DORADAS ── */
.deco-line{
  width:clamp(60px,15vw,120px);height:1px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
  margin:.6rem auto;
  opacity:0;animation:fadeUp 1.4s .5s forwards;
}

/* ── PANTALLA 2: MENSAJES SOBRE FLORES ── */
#s-msg{
  position:fixed;top:0;left:0;right:0;
  z-index:300;
  display:flex;justify-content:center;
  padding-top:5vmin;
  opacity:0;pointer-events:none;
  transition:opacity .8s ease;
}
#s-msg.show{opacity:1;pointer-events:auto;}

.msg-box{
  text-align:center;
  max-width:88vw;
}
.msg-text{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.4rem,4.5vw,3rem);
  font-style:italic;font-weight:300;
  color:#fff;
  letter-spacing:.06em;
  line-height:1.4;
  opacity:0;
  transform:translateY(-12px);
  transition:all .7s cubic-bezier(.34,1.4,.64,1);
  text-shadow:0 2px 20px rgba(0,0,0,.8), 0 0 40px rgba(0,0,0,.5);
}
.msg-text.in {opacity:1;transform:translateY(0);}
.msg-text.out{opacity:0;transform:translateY(-16px);}

.msg-deco{
  font-family:'Cinzel',serif;
  font-size:clamp(.55rem,1.4vw,.8rem);
  letter-spacing:.4em;
  color:rgba(255,255,255,.35);
  margin-top:.5rem;
  opacity:0;
  transition:opacity .7s ease .2s;
}
.msg-text.in + .msg-deco{opacity:1;}

/* ── PANTALLA FLORES (fondo) ── */
#s-flores{
  position:fixed;inset:0;z-index:80;
  opacity:0;pointer-events:none;
  transition:opacity 2s ease;
  display:flex;align-items:flex-end;justify-content:center;
  perspective:1000px;
}
#s-flores.show{opacity:1;}

.night{
  position:fixed;left:50%;top:0;transform:translateX(-50%);
  width:100%;height:100%;filter:blur(.1vmin);
  background-image:
    radial-gradient(ellipse at top, transparent 0%, var(--dark-color)),
    radial-gradient(ellipse at bottom, var(--dark-color), rgba(145,233,255,.2)),
    repeating-linear-gradient(220deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),
    repeating-linear-gradient(189deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),
    repeating-linear-gradient(148deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),
    linear-gradient(90deg,rgb(21,255,0),rgb(240,240,240));
}
.flowers{position:relative;transform:scale(.9);}
.flower{position:absolute;bottom:10vmin;transform-origin:bottom center;z-index:10;--fl-speed:.8s;}
.flower--1{animation:moving-flower-1 4s linear infinite;}
.flower--1 .flower__line{height:70vmin;animation-delay:.3s;}
.flower--1 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.6s backwards;}
.flower--1 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.4s backwards;}
.flower--1 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 1.2s backwards;}
.flower--1 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1s backwards;}
.flower--1 .flower__line__leaf--5{animation:blooming-leaf-right var(--fl-speed) 1.8s backwards;}
.flower--1 .flower__line__leaf--6{animation:blooming-leaf-left var(--fl-speed) 2s backwards;}
.flower--2{left:50%;transform:rotate(20deg);animation:moving-flower-2 4s linear infinite;}
.flower--2 .flower__line{height:60vmin;animation-delay:.6s;}
.flower--2 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.9s backwards;}
.flower--2 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.7s backwards;}
.flower--2 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 1.5s backwards;}
.flower--2 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1.3s backwards;}
.flower--3{left:50%;transform:rotate(-15deg);animation:moving-flower-3 4s linear infinite;}
.flower--3 .flower__line{animation-delay:.9s;}
.flower--3 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.5s backwards;}
.flower--3 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 2.3s backwards;}
.flower--3 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 2.1s backwards;}
.flower--3 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1.9s backwards;}
.flower__leafs{position:relative;animation:blooming-flower 2s backwards;}
.flower__leafs--1{animation-delay:1.1s;}
.flower__leafs--2{animation-delay:1.4s;}
.flower__leafs--3{animation-delay:1.7s;}
.flower__leafs::after{content:"";position:absolute;left:0;top:0;transform:translate(-50%,-100%);width:8vmin;height:8vmin;background-color:#1aaa15;filter:blur(10vmin);}
.flower__leaf{position:absolute;bottom:0;left:50%;width:8vmin;height:11vmin;border-radius:51% 49% 47% 53%/44% 45% 55% 69%;background-color:#1aaa15;background-image:linear-gradient(to top,#fce700,#fce700);transform-origin:bottom center;opacity:.9;box-shadow:inset 0 0 2vmin rgba(255,255,255,.5);}
.flower__leaf--1{transform:translate(-10%,1%) rotateY(40deg) rotateX(-50deg);}
.flower__leaf--2{transform:translate(-50%,-4%) rotateX(40deg);}
.flower__leaf--3{transform:translate(-90%,0%) rotateY(45deg) rotateX(50deg);}
.flower__leaf--4{width:8vmin;height:8vmin;transform-origin:bottom left;border-radius:4vmin 10vmin 4vmin 4vmin;transform:translate(0%,18%) rotateX(70deg) rotate(-43deg);background-image:linear-gradient(to top,#fce700,#fce700);z-index:1;opacity:.8;}
.flower__white-circle{position:absolute;left:-3.5vmin;top:-3vmin;width:9vmin;height:4vmin;border-radius:50%;background-color:#fff;}
.flower__white-circle::after{content:"";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:60%;height:60%;border-radius:inherit;background-image:linear-gradient(90deg,rgb(190,133,0),rgb(190,133,0));}
.flower__line{height:55vmin;width:1.5vmin;background-image:linear-gradient(to left,rgba(0,0,0,.2),transparent,rgba(255,255,255,.2)),linear-gradient(to top,transparent 10%,#064600,#064600);box-shadow:inset 0 0 2px rgba(0,0,0,.5);animation:grow-flower-tree 4s backwards;}
.flower__line__leaf{--w:7vmin;--h:calc(var(--w) + 2vmin);position:absolute;top:20%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background-image:linear-gradient(to top,rgba(20,122,20,.4),#1aaa15);}
.flower__line__leaf--1{transform:rotate(70deg) rotateY(30deg);}
.flower__line__leaf--2{top:45%;transform:rotate(70deg) rotateY(30deg);}
.flower__line__leaf--3,.flower__line__leaf--4,.flower__line__leaf--6{border-top-right-radius:0;border-bottom-left-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-460%;top:12%;transform:rotate(-70deg) rotateY(30deg);}
.flower__line__leaf--4{top:40%;}
.flower__line__leaf--5{top:0;transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(.6);}
.flower__line__leaf--6{top:-2%;left:-450%;transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(.6);}
.flower__light{position:absolute;bottom:0;width:1vmin;height:1vmin;background-color:rgb(255,251,0);border-radius:50%;filter:blur(.2vmin);animation:light-ans 4s linear infinite backwards;}
.flower__light:nth-child(odd){background-color:#fce700;}
.flower__light--1{left:-2vmin;animation-delay:1s;}
.flower__light--2{left:3vmin;animation-delay:.5s;}
.flower__light--3{left:-6vmin;animation-delay:.3s;}
.flower__light--4{left:6vmin;animation-delay:.9s;}
.flower__light--5{left:-1vmin;animation-delay:1.5s;}
.flower__light--6{left:-4vmin;animation-delay:3s;}
.flower__light--7{left:3vmin;animation-delay:2s;}
.flower__light--8{left:-6vmin;animation-delay:3.5s;}
.flower__grass{--c:#00b815;--line-w:1.5vmin;position:absolute;bottom:12vmin;left:-7vmin;display:flex;flex-direction:column;align-items:flex-end;z-index:20;transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg);}
.flower__grass--1{animation:moving-grass 2s linear infinite;}
.flower__grass--2{left:2vmin;bottom:10vmin;transform:scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);opacity:.8;z-index:0;animation:moving-grass--2 1.5s linear infinite;}
.flower__grass--top{width:7vmin;height:10vmin;border-top-right-radius:100%;border-right:var(--line-w) solid var(--c);transform-origin:bottom center;transform:rotate(-2deg);}
.flower__grass--bottom{margin-top:-2px;width:var(--line-w);height:25vmin;background-image:linear-gradient(to top,transparent,var(--c));}
.flower__grass__leaf{--size:10vmin;position:absolute;width:calc(var(--size)*2.1);height:var(--size);border-top-left-radius:var(--size);border-top-right-radius:var(--size);background-image:linear-gradient(to top,rgba(20,122,20,.4),#1aaa15);}
.flower__grass__leaf--1{bottom:2vmin;left:-76%;transform:rotate(2deg);}
.flower__grass__leaf--2{bottom:5vmin;left:-70%;transform:rotate(-1deg);}
.flower__grass__leaf--3{bottom:8vmin;left:-74%;transform:rotate(3deg);}
.flower__grass__leaf--4{bottom:11vmin;left:-72%;transform:rotate(-2deg);}
.flower__grass__leaf--5{bottom:2vmin;left:-50%;transform:rotate(-1deg);}
.flower__grass__leaf--6{bottom:5vmin;left:-55%;transform:rotate(2deg);}
.flower__grass__leaf--7{bottom:8vmin;left:-48%;transform:rotate(-3deg);}
.flower__grass__leaf--8{bottom:11vmin;left:-53%;transform:rotate(1deg);}
.flower__grass__overlay{position:absolute;bottom:-1vmin;left:-100%;width:300%;height:30vmin;background-image:linear-gradient(to top,var(--dark-color) 30%,transparent);}
.flower__g-long{display:flex;flex-direction:column;align-items:flex-end;position:relative;}
.flower__g-long__top{width:1.2vmin;height:30vmin;border-radius:1vmin;background-image:linear-gradient(to top,transparent,#064600,#064600);position:relative;}
.flower__g-long__top::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:6vmin;height:6vmin;border-radius:50%;background-image:radial-gradient(circle at center,#fce700 0%,transparent 70%);filter:blur(.5vmin);}
.flower__g-long__bottom{width:1.5vmin;height:40vmin;background-image:linear-gradient(to top,transparent 10%,#064600,#064600);}
.flower__g-right{position:absolute;}
.flower__g-right--1{bottom:22vmin;left:5vmin;}
.flower__g-right--2{bottom:14vmin;left:3vmin;transform:rotateY(180deg);}
.flower__g-right .leaf{--w:10vmin;--h:30vmin;--c:#1aaa15;position:relative;bottom:0;width:var(--w);height:var(--h);border-top-left-radius:100%;border-left:2vmin solid var(--c);-webkit-mask-image:linear-gradient(to top,transparent 20%,var(--dark-color));transform-origin:bottom center;}
.flower__g-front{position:absolute;bottom:0;left:-5vmin;}
.flower__g-front__leaf-wrapper{position:absolute;bottom:0;transform-origin:bottom center;}
.flower__g-front__leaf-wrapper--1{transform:rotate(-70deg);left:-3vmin;}
.flower__g-front__leaf-wrapper--2{transform:rotate(-50deg);left:-2vmin;}
.flower__g-front__leaf-wrapper--3{transform:rotate(-30deg);left:-1vmin;}
.flower__g-front__leaf-wrapper--4{transform:rotate(-10deg);left:0;}
.flower__g-front__leaf-wrapper--5{transform:rotate(10deg);left:1vmin;}
.flower__g-front__leaf-wrapper--6{transform:rotate(30deg);left:2vmin;}
.flower__g-front__leaf-wrapper--7{transform:rotate(50deg);left:3vmin;}
.flower__g-front__leaf-wrapper--8{transform:rotate(70deg);left:4vmin;}
.flower__g-front__leaf{width:3vmin;height:15vmin;border-top-left-radius:100%;border-left:1.5vmin solid #1aaa15;-webkit-mask-image:linear-gradient(to top,transparent 20%,var(--dark-color));}
.flower__g-front__line{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:1.2vmin;height:5vmin;background-image:linear-gradient(to top,transparent,#064600);}
.flower__g-fr{position:absolute;bottom:0;left:-2vmin;}
.flower__g-fr .leaf{--w:5vmin;--h:20vmin;--c:#1aaa15;}
.flower__g-fr__leaf{position:absolute;bottom:0;width:3vmin;height:12vmin;border-top-left-radius:100%;border-left:1.5vmin solid #1aaa15;-webkit-mask-image:linear-gradient(to top,transparent 20%,var(--dark-color));transform-origin:bottom center;}
.flower__g-fr__leaf--1{transform:rotate(-80deg) translateX(-1vmin);}
.flower__g-fr__leaf--2{transform:rotate(-60deg) translateX(-1vmin);}
.flower__g-fr__leaf--3{transform:rotate(-40deg) translateX(-.5vmin);}
.flower__g-fr__leaf--4{transform:rotate(-20deg);}
.flower__g-fr__leaf--5{transform:rotate(0deg);}
.flower__g-fr__leaf--6{transform:rotate(20deg);}
.flower__g-fr__leaf--7{transform:rotate(40deg);}
.flower__g-fr__leaf--8{transform:rotate(60deg);}
.long-g{position:absolute;bottom:0;}
.long-g--0{left:2vmin;}.long-g--1{left:6vmin;}.long-g--2{left:10vmin;}
.long-g--3{left:-2vmin;}.long-g--4{left:-6vmin;}.long-g--5{left:-10vmin;}
.long-g--6{left:14vmin;}.long-g--7{left:-14vmin;}
.long-g .leaf{--w:15vmin;--h:40vmin;--c:#1aaa15;position:absolute;bottom:0;width:var(--w);height:var(--h);border-top-left-radius:100%;border-left:2vmin solid var(--c);-webkit-mask-image:linear-gradient(to top,transparent 20%,var(--dark-color));transform-origin:bottom center;}
.long-g .leaf--0{left:2vmin;animation:leaf-ans-1 4s linear infinite;}
.long-g .leaf--1{--w:5vmin;--h:60vmin;animation:leaf-ans-1 4s linear infinite;}
.long-g .leaf--2{--w:10vmin;--h:40vmin;left:-.5vmin;bottom:5vmin;transform-origin:bottom left;transform:rotateY(-180deg);animation:leaf-ans-2 3s linear infinite;}
.long-g .leaf--3{--w:5vmin;--h:30vmin;left:-1vmin;bottom:3.2vmin;transform-origin:bottom left;transform:rotate(-10deg) rotateY(-180deg);animation:leaf-ans-3 3s linear infinite;}
.grow-ans{animation:grow-ans 2s var(--d) backwards;}
.growing-grass{animation:growing-grass-ans 1s 2s backwards;}

/* ── PANTALLA FINAL ── */
#s-final{
  position:fixed;inset:0;z-index:400;
  background:radial-gradient(ellipse 80% 60% at 50% 80%, #1a0025 0%, #0a0010 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 2s ease;
  gap:1.5rem;
}
#s-final.show{opacity:1;pointer-events:auto;}

.final-ornament{
  font-size:clamp(1.2rem,3vw,2rem);
  color:var(--rose);
  letter-spacing:.5em;
  animation:breathe 3s ease-in-out infinite;
}
.final-title{
  font-family:'Cinzel',serif;
  font-size:clamp(1.2rem,4vw,2.5rem);
  letter-spacing:.2em;
  color:var(--gold-soft);
  text-shadow:0 0 30px rgba(201,168,76,.4);
  animation:breathe 3s ease-in-out infinite;
}
.final-subtitle{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1rem,2.5vw,1.6rem);
  font-style:italic;font-weight:300;
  color:rgba(255,255,255,.7);
  letter-spacing:.08em;
}
.final-line{
  width:clamp(80px,20vw,160px);height:1px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:.85;}
  50%{transform:scale(1.04);opacity:1;}
}

/* ── KEYFRAMES FLORES ── */
@keyframes leaf-ans-1{0%,100%{transform:rotate(-5deg) scale(1);}50%{transform:rotate(5deg) scale(1.1);}}
@keyframes leaf-ans-2{0%,100%{transform:rotateY(-180deg) rotate(5deg);}50%{transform:rotateY(-180deg) rotate(0deg) scale(1.1);}}
@keyframes leaf-ans-3{0%,100%{transform:rotate(-10deg) rotateY(-180deg);}50%{transform:rotate(-20deg) rotateY(-180deg);}}
@keyframes grow-ans{0%{transform:scale(0);opacity:0;}}
@keyframes light-ans{
  0%{opacity:0;transform:translateY(0);}
  25%{opacity:1;transform:translateY(-5vmin) translateX(-2vmin);}
  50%{opacity:1;transform:translateY(-15vmin) translateX(2vmin);filter:blur(.2vmin);}
  75%{transform:translateY(-20vmin) translateX(-2vmin);filter:blur(.2vmin);}
  100%{transform:translateY(-30vmin);opacity:0;filter:blur(1vmin);}
}
@keyframes moving-flower-1{0%,100%{transform:rotate(2deg);}50%{transform:rotate(-2deg);}}
@keyframes moving-flower-2{0%,100%{transform:rotate(18deg);}50%{transform:rotate(14deg);}}
@keyframes moving-flower-3{0%,100%{transform:rotate(-18deg);}50%{transform:rotate(-20deg) rotateY(-10deg);}}
@keyframes blooming-leaf-right{0%{transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(0);}}
@keyframes blooming-leaf-left{0%{transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(0);}}
@keyframes grow-flower-tree{0%{height:0;border-radius:1vmin;}}
@keyframes blooming-flower{0%{transform:scale(0);}}
@keyframes moving-grass{0%,100%{transform:rotate(-48deg) rotateY(40deg);}50%{transform:rotate(-50deg) rotateY(40deg);}}
@keyframes moving-grass--2{0%,100%{transform:scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);}50%{transform:scale(.5) rotate(79deg) rotateX(10deg) rotateY(-200deg);}}
@keyframes growing-grass-ans{0%{transform:scale(0);}}

/* ── CORAZONES FINALES ── */
.heart-fall{
  position:fixed;pointer-events:none;z-index:401;
  animation:hfall linear forwards;
  color:var(--rose);
}
@keyframes hfall{
  0%{opacity:1;transform:translateY(0) rotate(0deg);}
  100%{opacity:0;transform:translateY(110vh) rotate(540deg);}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<audio id="bgMusic" loop><source src="amor.mp3" type="audio/mpeg"></audio>

<!-- FONDO -->
<div class="backdrop"></div>
<canvas class="stars-canvas" id="starsCanvas"></canvas>

  <div class="moon-crater"></div>

    <div class="growing-grass"><div class="flower__grass flower__grass--1"><div class="flower__grass--top"></div><div class="flower__grass--bottom"></div><div class="flower__grass__leaf flower__grass__leaf--1"></div><div class="flower__grass__leaf flower__grass__leaf--2"></div><div class="flower__grass__leaf flower__grass__leaf--3"></div><div class="flower__grass__leaf flower__grass__leaf--4"></div><div class="flower__grass__leaf flower__grass__leaf--5"></div><div class="flower__grass__leaf flower__grass__leaf--6"></div><div class="flower__grass__leaf flower__grass__leaf--7"></div><div class="flower__grass__leaf flower__grass__leaf--8"></div><div class="flower__grass__overlay"></div></div></div>
    <div class="growing-grass"><div class="flower__grass flower__grass--2"><div class="flower__grass--top"></div><div class="flower__grass--bottom"></div><div class="flower__grass__leaf flower__grass__leaf--1"></div><div class="flower__grass__leaf flower__grass__leaf--2"></div><div class="flower__grass__leaf flower__grass__leaf--3"></div><div class="flower__grass__leaf flower__grass__leaf--4"></div><div class="flower__grass__leaf flower__grass__leaf--5"></div><div class="flower__grass__leaf flower__grass__leaf--6"></div><div class="flower__grass__leaf flower__grass__leaf--7"></div><div class="flower__grass__leaf flower__grass__leaf--8"></div><div class="flower__grass__overlay"></div></div></div>
    <div class="grow-ans" style="--d:2.4s"><div class="flower__g-right flower__g-right--1"><div class="leaf"></div></div></div>
    <div class="grow-ans" style="--d:2.8s"><div class="flower__g-right flower__g-right--2"><div class="leaf"></div></div></div>
    <div class="grow-ans" style="--d:2.8s"><div class="flower__g-front"><div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--1"><div class="flower__g-front__leaf"></div></div><div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--2"><div class="flower__g-front__leaf"></div></div><div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--3"><div class="flower__g-front__leaf"></div></div><div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--4"><div class="flower__g-front__leaf"></div></div><div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--5"><div class="flower__g-front__leaf"></div></div><div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--6"><div class="flower__g-front__leaf"></div></div><div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--7"><div class="flower__g-front__leaf"></div></div><div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--8"><div class="flower__g-front__leaf"></div></div><div class="flower__g-front__line"></div></div></div>
    <div class="grow-ans" style="--d:3.2s"><div class="flower__g-fr"><div class="leaf"></div><div class="flower__g-fr__leaf flower__g-fr__leaf--1"></div><div class="flower__g-fr__leaf flower__g-fr__leaf--2"></div><div class="flower__g-fr__leaf flower__g-fr__leaf--3"></div><div class="flower__g-fr__leaf flower__g-fr__leaf--4"></div><div class="flower__g-fr__leaf flower__g-fr__leaf--5"></div><div class="flower__g-fr__leaf flower__g-fr__leaf--6"></div><div class="flower__g-fr__leaf flower__g-fr__leaf--7"></div><div class="flower__g-fr__leaf flower__g-fr__leaf--8"></div></div></div>
    <div class="long-g long-g--0"><div class="grow-ans" style="--d:3s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:2.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:3.4s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div></div>
    <div class="long-g long-g--1"><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:3.8s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:4s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--3"></div></div></div>
    <div class="long-g long-g--2"><div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:4.4s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:4.6s"><div class="leaf leaf--3"></div></div></div>
    <div class="long-g long-g--3"><div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:3s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div></div>
    <div class="long-g long-g--4"><div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:3s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div></div>
    <div class="long-g long-g--5"><div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:3s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div></div>
    <div class="long-g long-g--6"><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:4.4s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:4.6s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:4.8s"><div class="leaf leaf--3"></div></div></div>
    <div class="long-g long-g--7"><div class="grow-ans" style="--d:3s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:3.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:3.5s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div></div>

<!-- ══ FINAL ══ -->
<div id="s-final">
  <div class="final-ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
  <div class="final-line"></div>
  <h2 class="final-title">G R A C I A S</h2>
  <p class="final-subtitle">por todo lo que eres</p>
  <div class="final-line"></div>
  <div class="final-ornament" style="font-size:1.6rem;">♡</div>
</div>

<script>
const scenes=[
  {t:"A veces pienso que coincidimos demasiado bonito",         c:"#f5a3b0"},
  {t:"para ser casualidad.",                                     c:"#e8d08a"},
  {t:"Porque entre tantas personas, tantos caminos",             c:"#a8d8ea"},
  {t:"y tantos instantes, apareciste tú…",                      c:"#c9b1d9"},
  {t:"y desde entonces todo tiene un poco más de calma,",       c:"#a8e6cf"},
  {t:"más vida y más sentido.",                                  c:"#f5a3b0"},
  {t:"Hoy solo quiero decirte que eres maravillosa,",           c:"#fff"},
  {t:"más de lo que puedas imaginar.",                          c:"#e8d08a"},
  {t:"Tienes la capacidad de volver un día gris",               c:"#f5a3b0"},
  {t:"en uno inmensamente hermoso,",                            c:"#a8e6cf"},
  {t:"incluso sin darte cuenta.",                               c:"#e8d08a"},
  {t:"Tu sonrisa, tu magia",                                    c:"#f5a3b0"},
  {t:"y esa forma tan bonita de ser",                           c:"#c9b1d9"},
  {t:"siempre te harán única, especial e irrepetible.",         c:"#a8d8ea"},
  {t:"Porque hay personas que simplemente llegan…",             c:"#fff"},
  {t:"pero tú llegaste para dejar algo lindo en mi vida.",      c:"#f5a3b0"},
  {t:"Tienes esa manera de iluminar todo con tu presencia,",    c:"#e8d08a"},
  {t:"de hacer sentir tranquilidad con una sola conversación",  c:"#a8e6cf"},
  {t:"y de convertir momentos simples en recuerdos inolvidables.", c:"#c9b1d9"},
  {t:"A veces la vida pone personas en nuestro camino sin avisar,", c:"#fff"},
  {t:"pero contigo sentí algo diferente:",                      c:"#f5a3b0"},
  {t:"una conexión bonita, sincera y difícil de explicar.",     c:"#a8d8ea"},
  {t:"Como si entre tanto ruido,",                              c:"#e8d08a"},
  {t:"por fin hubiera encontrado un lugar",                     c:"#a8e6cf"},
  {t:"donde todo se siente más en paz.",                        c:"#f5a3b0"},
  {t:"Solo espero que nunca olvides lo valiosa que eres,",      c:"#c9b1d9"},
  {t:"porque mereces todo lo bonito",                           c:"#e8d08a"},
  {t:"que el mundo pueda darte.",                               c:"#f5a3b0"},
];

const sWelcome=document.getElementById('s-welcome');
const sMsg=document.getElementById('s-msg');
const sFlores=document.getElementById('s-flores');
const sFinal=document.getElementById('s-final');
const msgText=document.getElementById('msgText');
const bgMusic=document.getElementById('bgMusic');
const moon=document.getElementById('moon');
const canvas=document.getElementById('starsCanvas');
const ctx=canvas.getContext('2d');

// Estrellas
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
const STARS=Array.from({length:180},()=>({
  x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,
  r:Math.random()*1.4+.3,o:Math.random()*.7+.2,
  speed:Math.random()*.0008+.0002,phase:Math.random()*Math.PI*2
}));
let raf;
function drawStars(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  STARS.forEach(s=>{
    const alpha=s.o*(0.6+0.4*Math.sin(t*s.speed*1000+s.phase));
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,248,220,${alpha})`;ctx.fill();
  });
  raf=requestAnimationFrame(t=>drawStars(t));
}
drawStars(0);

// Pétalos cayendo
const petalChars=['✿','❀','✾','❁','꽃','⁎'];
let petalTimer;
function spawnPetal(){
  const p=document.createElement('div');
  p.className='petal';
  p.textContent=petalChars[Math.floor(Math.random()*petalChars.length)];
  p.style.left=Math.random()*100+'vw';
  p.style.color=`hsl(${330+Math.random()*40},80%,${75+Math.random()*15}%)`;
  const dur=6+Math.random()*8;
  p.style.animationDuration=dur+'s';
  p.style.fontSize=(10+Math.random()*14)+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),(dur+1)*1000);
}

// Botón inicio
document.getElementById('btnStart').addEventListener('click',()=>{
  bgMusic.volume=0.45;bgMusic.play().catch(()=>{});
  moon.classList.add('show');
  sWelcome.classList.add('out');
  petalTimer=setInterval(spawnPetal,600);
  setTimeout(()=>{
    sFlores.classList.add('show');
    sMsg.classList.add('show');
    playScenes(0);
  },1000);
});

// Escenas
function playScenes(i){
  if(i>=scenes.length){
    setTimeout(()=>{
      sMsg.style.opacity='0';
      setTimeout(()=>{
        clearInterval(petalTimer);
        sFinal.classList.add('show');
        heartRain();
      },1000);
    },800);
    return;
  }
  const sc=scenes[i];
  msgText.style.color=sc.c;
  msgText.textContent=sc.t;
  msgText.style.textShadow=`0 2px 24px rgba(0,0,0,.9), 0 0 30px ${sc.c}55`;
  void msgText.offsetWidth;
  msgText.classList.remove('out');msgText.classList.add('in');
  const delay=sc.t.length<30?2400:3400;
  setTimeout(()=>{
    msgText.classList.remove('in');msgText.classList.add('out');
    setTimeout(()=>playScenes(i+1),600);
  },delay);
}

// Lluvia de corazones
function heartRain(){
  for(let i=0;i<40;i++){
    setTimeout(()=>{
      const h=document.createElement('div');
      h.className='heart-fall';
      h.textContent='♡';
      h.style.left=Math.random()*100+'vw';
      h.style.top='-30px';
      const dur=3+Math.random()*4;
      h.style.animationDuration=dur+'s';
      h.style.fontSize=(14+Math.random()*20)+'px';
      h.style.color=`hsl(${340+Math.random()*30},70%,${70+Math.random()*15}%)`;
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),(dur+1)*1000);
    },i*120);
  }
}
</script>
</body>
</html>
